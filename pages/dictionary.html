<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictionary | FabVocab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/dictionary.css">
</head>

<body>
  <!-- Shared decorative icons -->
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/>
    </symbol>

    <symbol id="icon-dictionary" viewBox="0 0 24 24">
      <path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1Z"/>
    </symbol>

    <symbol id="icon-training" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    </symbol>

    <symbol id="icon-progress" viewBox="0 0 24 24">
      <path d="m2 17 7-7 5 5 8-9 M16 6h6v6"/>
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6"/>
      <path d="m15 15 6 6"/>
    </symbol>

    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m9 5 7 7-7 7"/>
    </symbol>

    <symbol id="icon-caret" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>

    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
    </symbol>
  </svg>

  <!-- Shared mobile header; the title is updated by dictionary.js -->
  <header class="mobile-header">
    <span class="mobile-title" id="dictionary-mobile-title">Dictionary</span>
    <span class="profile-avatar">AB</span>
  </header>

  <!-- Bottom navigation on mobile; top navigation on desktop -->
  <nav class="primary-navigation" aria-label="Main navigation">
    <a class="brand" href="index.html">FabVocab.</a>

    <div class="navigation-destinations">
      <a class="navigation-item" href="index.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-home"/></svg>
        <span>Home</span>
      </a>

      <a class="navigation-item navigation-current" href="dictionary.html" aria-current="page">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-dictionary"/></svg>
        <span>Dictionary</span>
      </a>

      <a class="navigation-item" href="training.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-training"/></svg>
        <span>Training</span>
      </a>

      <a class="navigation-item" href="progress.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-progress"/></svg>
        <span>Progress</span>
      </a>
    </div>

    <a class="add-word" href="#add-word" aria-label="Add a word">
      <svg class="interface-icon" aria-hidden="true"><use href="#icon-plus"/></svg>
      <span>+ Add word</span>
    </a>
  </nav>

  <main class="dictionary-app">

    <!-- 1. Dictionary list -->
    <section
      class="dictionary-screen dictionary-list"
      id="dictionary"
      aria-labelledby="dictionary-heading"
    >
      <h1 class="sr-only" id="dictionary-heading">Dictionary</h1>

      <div class="search-field">
        <label class="sr-only" for="word-search">Search your words</label>
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-search"/></svg>
        <input id="word-search" type="search" placeholder="Search your words...">
      </div>

      <form class="dictionary-filters" id="dictionary-filters">
        <div class="filter-colors">
          <span class="filter-label">Filter:</span>

          <fieldset class="color-picker filter-picker">
            <legend class="sr-only">Filter by color</legend>

            <label class="color-option color-white" for="filter-white">
              <input id="filter-white" type="radio" name="filter-color" value="white" aria-label="White">
            </label>
            <label class="color-option color-gray" for="filter-gray">
              <input id="filter-gray" type="radio" name="filter-color" value="gray" aria-label="Gray">
            </label>
            <label class="color-option color-black" for="filter-black">
              <input id="filter-black" type="radio" name="filter-color" value="black" aria-label="Black">
            </label>
            <label class="color-option color-red" for="filter-red">
              <input id="filter-red" type="radio" name="filter-color" value="red" aria-label="Red">
            </label>
            <label class="color-option color-yellow" for="filter-yellow">
              <input id="filter-yellow" type="radio" name="filter-color" value="yellow" aria-label="Yellow">
            </label>
            <label class="color-option color-green" for="filter-green">
              <input id="filter-green" type="radio" name="filter-color" value="green" aria-label="Green">
            </label>
            <label class="color-option color-blue" for="filter-blue">
              <input id="filter-blue" type="radio" name="filter-color" value="blue" aria-label="Blue">
            </label>
            <label class="color-option color-pink" for="filter-pink">
              <input id="filter-pink" type="radio" name="filter-color" value="pink" aria-label="Pink">
            </label>
          </fieldset>
        </div>

        <fieldset class="filter-chips">
          <legend class="sr-only">Part of speech filter</legend>
          <label><input type="radio" name="speech-filter" value="noun">noun</label>
          <label><input type="radio" name="speech-filter" value="verb">verb</label>
          <label><input type="radio" name="speech-filter" value="adjective">adj</label>
          <label><input type="radio" name="speech-filter" value="adverb">adv</label>
          <label><input type="radio" name="speech-filter" value="idiom">idiom</label>
          <label><input type="radio" name="speech-filter" value="expression">expression</label>
        </fieldset>

        <fieldset class="filter-chips status-filters">
          <legend class="sr-only">Learning status filter</legend>
          <label><input type="radio" name="status-filter" value="new">new</label>
          <label><input type="radio" name="status-filter" value="learning">learning</label>
          <label><input type="radio" name="status-filter" value="mastered">mastered</label>
          <label><input type="radio" name="status-filter" value="dusty">dusty</label>
        </fieldset>

        <button class="filter-reset" type="button" id="filter-reset">Reset</button>
      </form>

      <!-- Rows become cards on mobile via CSS -->
      <table class="word-table">
        <caption class="sr-only">Saved words</caption>
        <thead class="word-table-header">
          <tr>
            <th scope="col">Color</th>
            <th scope="col" aria-sort="none" data-sort-col="word">
              <button class="table-sort" type="button" data-sort="word">
                Word
                <svg class="interface-icon" aria-hidden="true"><use href="#icon-caret"/></svg>
              </button>
            </th>
            <th scope="col" aria-sort="none" data-sort-col="pos">
              <button class="table-sort" type="button" data-sort="pos">
                Part of speech
                <svg class="interface-icon" aria-hidden="true"><use href="#icon-caret"/></svg>
              </button>
            </th>
            <th scope="col" aria-sort="none" data-sort-col="status">
              <button class="table-sort" type="button" data-sort="status">
                Status
                <svg class="interface-icon" aria-hidden="true"><use href="#icon-caret"/></svg>
              </button>
            </th>
            <th scope="col" aria-sort="none" data-sort-col="date">
              <button class="table-sort" type="button" data-sort="date">
                Last practiced
                <svg class="interface-icon" aria-hidden="true"><use href="#icon-caret"/></svg>
              </button>
            </th>
          </tr>
        </thead>

        <tbody id="word-tbody"></tbody>
      </table>

      <!-- Shown by dictionary.js when a search / filter returns nothing -->
      <div class="empty-message dictionary-empty-note" id="dictionary-empty-note" hidden>
        <span class="empty-icon">
          <svg class="interface-icon" aria-hidden="true"><use href="#icon-search"/></svg>
        </span>
        <h2>Nope, nothing here.</h2>
        <p>Did you make that word up?</p>
      </div>
    </section>

    <!-- 2. Add word -->
    <section
      class="dictionary-screen form-screen"
      id="add-word"
      aria-labelledby="add-heading"
    >
      <h1 class="form-heading" id="add-heading">New word</h1>

      <form class="word-form" id="add-form" novalidate>
        <div class="form-field">
          <label for="add-text">Word *</label>
          <input id="add-text" name="word" placeholder="What is it?" required>
        </div>

        <div class="form-field">
          <label for="add-speech">Part of speech *</label>
          <select id="add-speech" name="pos" required></select>
        </div>

        <fieldset class="form-field">
          <legend>Color *</legend>
          <div class="color-picker" data-color-picker="add"></div>
        </fieldset>

        <div class="form-field">
          <label for="add-definition">Definition *</label>
          <textarea id="add-definition" name="definition" placeholder="What does it mean?" required></textarea>
        </div>

        <div class="form-field">
          <label for="add-translation">Translation</label>
          <input id="add-translation" name="translation" placeholder="What does it mean in your lang?">
        </div>

        <div class="form-field">
          <label for="add-example">Example</label>
          <input id="add-example" name="example" placeholder="Later is fine">
        </div>

        <div class="form-actions">
          <button class="button button-primary" type="submit">Lock it in</button>
        </div>
      </form>
    </section>

    <!-- 3. Word details — generated by dictionary.js from the selected word -->
    <section
      class="dictionary-screen detail-screen"
      id="word-detail"
      aria-labelledby="detail-heading"
    >
      <div id="detail-root"></div>
    </section>

    <!-- 4. Edit word -->
    <section
      class="dictionary-screen form-screen"
      id="edit-word"
      aria-labelledby="edit-heading"
    >
      <h1 class="form-heading" id="edit-heading">Edit word</h1>

      <form class="word-form" id="edit-form" novalidate>
        <div class="form-field">
          <label for="edit-text">Word *</label>
          <input id="edit-text" name="word" required>
        </div>

        <div class="form-field">
          <label for="edit-speech">Part of speech *</label>
          <select id="edit-speech" name="pos" required></select>
        </div>

        <fieldset class="form-field">
          <legend>Color *</legend>
          <div class="color-picker" data-color-picker="edit"></div>
        </fieldset>

        <div class="form-field">
          <label for="edit-definition">Definition *</label>
          <textarea id="edit-definition" name="definition" required></textarea>
        </div>

        <div class="form-field">
          <label for="edit-translation">Translation</label>
          <input id="edit-translation" name="translation" placeholder="What does it mean in your lang?">
        </div>

        <div class="form-field">
          <label for="edit-example">Example</label>
          <input id="edit-example" name="example" placeholder="Later is fine">
        </div>

        <div class="form-actions">
          <button class="button button-delete" type="button" id="edit-delete">Delete word</button>
          <button class="button button-primary" type="submit">Save</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Delete confirmation modal (opened from detail / edit) -->
  <div class="delete-overlay" id="delete-modal" hidden>
    <div
      class="delete-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-heading"
      aria-describedby="delete-description"
    >
      <h2 id="delete-heading">Sure?</h2>
      <p id="delete-description">It's been through a lot with you.</p>
      <button class="button button-danger" type="button" id="delete-confirm">Delete</button>
      <button class="button button-secondary" type="button" id="delete-cancel">Keep it</button>
    </div>
  </div>

  <!-- Transient status toast (e.g. "Locked in. Next victim?") -->
  <aside class="success-toast" id="dictionary-toast" role="status" hidden>
    <span id="dictionary-toast-text"></span>
    <button type="button" id="dictionary-toast-dismiss" aria-label="Dismiss notification">×</button>
  </aside>

  <script type="module" src="../scripts/dictionary.js"></script>
</body>
</html>
