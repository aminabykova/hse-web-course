<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress | FabVocab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/progress.css">
</head>

<body>
  <!-- Shared decorative icons -->
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/>
    </symbol>

    <symbol id="icon-dictionary" viewBox="0 0 24 24">
      <path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1Z"/>
    </symbol>

    <symbol id="icon-training" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    </symbol>

    <symbol id="icon-progress" viewBox="0 0 24 24">
      <path d="m2 17 7-7 5 5 8-9 M16 6h6v6"/>
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
  </svg>

  <!-- Mobile header -->
  <header class="mobile-header">
    <span class="mobile-title">Progress</span>
    <span class="profile-avatar">AB</span>
  </header>

  <!-- Bottom navigation on mobile; top navigation on desktop -->
  <nav class="primary-navigation" aria-label="Main navigation">
    <a class="brand" href="index.html">FabVocab.</a>

    <div class="navigation-destinations">
      <a class="navigation-item" href="index.html">
        <svg class="interface-icon" aria-hidden="true">
          <use href="#icon-home"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="navigation-item" href="dictionary.html">
        <svg class="interface-icon" aria-hidden="true">
          <use href="#icon-dictionary"/>
        </svg>
        <span>Dictionary</span>
      </a>

      <a class="navigation-item" href="training.html">
        <svg class="interface-icon" aria-hidden="true">
          <use href="#icon-training"/>
        </svg>
        <span>Training</span>
      </a>

      <a
        class="navigation-item navigation-current"
        href="progress.html"
        aria-current="page"
      >
        <svg class="interface-icon" aria-hidden="true">
          <use href="#icon-progress"/>
        </svg>
        <span>Progress</span>
      </a>
    </div>

    <a class="add-word" href="dictionary.html#add-word" aria-label="Add a word">
      <svg class="interface-icon" aria-hidden="true">
        <use href="#icon-plus"/>
      </svg>
      <span>+ Add word</span>
    </a>
  </nav>

  <main class="progress-content">

    <!-- Populated progress — panels are generated by progress.js -->
    <section
      class="progress-screen progress-populated"
      id="progress"
      aria-labelledby="progress-heading"
    ></section>

    <!-- Empty progress -->
    <section
      class="progress-screen progress-empty"
      id="progress-empty"
      aria-labelledby="empty-heading"
    >
      <div class="empty-state">
        <div class="empty-message">
          <span class="empty-illustration" aria-hidden="true">
            <svg class="interface-icon">
              <use href="#icon-progress"/>
            </svg>
          </span>

          <h1 class="empty-heading" id="empty-heading">
            Nothing here yet
          </h1>

          <p class="empty-description">
            Nothing to show yet — but that’s the boring part, go fix it.
          </p>
        </div>

        <a class="button button-primary empty-action" href="dictionary.html#add-word">
          Go catch some words
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="../scripts/progress.js"></script>
</body>
</html>
