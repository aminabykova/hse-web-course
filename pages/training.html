<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training | FabVocab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/training.css">
</head>

<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/>
    </symbol>

    <symbol id="icon-dictionary" viewBox="0 0 24 24">
      <path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1Z"/>
    </symbol>

    <symbol id="icon-training" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    </symbol>

    <symbol id="icon-progress" viewBox="0 0 24 24">
      <path d="m2 17 7-7 5 5 8-9 M16 6h6v6"/>
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <symbol id="icon-chevron" viewBox="0 0 16 16">
      <path d="m4 6 4 4 4-4"/>
    </symbol>
  </svg>

  <!-- Mobile header; the title is updated by training.js -->
  <header class="mobile-header">
    <p class="mobile-title" id="training-mobile-title">Quiz setup</p>
    <span class="profile-avatar">AB</span>
  </header>

  <!-- Bottom navigation on mobile; top navigation on desktop -->
  <nav class="primary-navigation" aria-label="Main navigation">
    <a class="brand" href="index.html">FabVocab.</a>

    <div class="navigation-destinations">
      <a class="navigation-item" href="index.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-home"/></svg>
        <span>Home</span>
      </a>

      <a class="navigation-item" href="dictionary.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-dictionary"/></svg>
        <span>Dictionary</span>
      </a>

      <a
        href="training.html"
        class="navigation-item navigation-current"
        aria-current="page"
      >
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-training"/></svg>
        <span>Training</span>
      </a>

      <a class="navigation-item" href="progress.html">
        <svg class="interface-icon" aria-hidden="true"><use href="#icon-progress"/></svg>
        <span>Progress</span>
      </a>
    </div>

    <a class="add-word" href="dictionary.html#add-word" aria-label="Add a word">
      <svg class="interface-icon" aria-hidden="true"><use href="#icon-plus"/></svg>
      <span>+ Add word</span>
    </a>
  </nav>

  <main class="training-content">

    <!-- 1. Quiz setup -->
    <section
      id="training-setup"
      class="training-screen setup-screen"
      aria-labelledby="setup-heading"
    >
      <h1 id="setup-heading">Quiz setup</h1>

      <form class="setup-form" id="setup-form">
        <fieldset>
          <legend>Training direction</legend>

          <div class="setup-options">
            <label class="setup-choice">
              <input class="native-radio" type="radio" name="setup-direction" value="word" checked>
              <span class="choice-title">Word → Definition</span>
              <span class="choice-description">See the word, guess the correct meaning.</span>
            </label>

            <label class="setup-choice">
              <input class="native-radio" type="radio" name="setup-direction" value="definition">
              <span class="choice-title">Definition → Word</span>
              <span class="choice-description">Reverse recall. Harder, but highly rewarding.</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Difficulty Mode</legend>

          <div class="setup-options">
            <label class="setup-choice">
              <input class="native-radio" type="radio" name="setup-difficulty" value="regular" checked>
              <span class="choice-title">Regular mode</span>
              <span class="choice-description">Options in different colors</span>
            </label>

            <label class="setup-choice">
              <input class="native-radio" type="radio" name="setup-difficulty" value="hard">
              <span class="choice-title">Hard mode</span>
              <span class="choice-description" id="hard-mode-note">Same color chaos</span>
            </label>
          </div>
        </fieldset>

        <div class="setup-start-row">
          <fieldset>
            <legend>Questions</legend>

            <div class="question-count">
              <label>
                <input class="native-radio" type="radio" name="setup-count" value="5" checked>
                <span>5</span>
              </label>
              <label>
                <input class="native-radio" type="radio" name="setup-count" value="10">
                <span>10</span>
              </label>
              <label>
                <input class="native-radio" type="radio" name="setup-count" value="15">
                <span>15</span>
              </label>
            </div>
          </fieldset>

          <button type="submit" class="button button-primary setup-start" id="setup-start">
            Let's go
          </button>
        </div>

        <p class="setup-note" id="setup-note" hidden></p>
      </form>
    </section>

    <!-- 2. Question / hint / feedback — one screen, states toggled by training.js -->
    <section
      id="quiz-question"
      class="training-screen quiz-screen question-screen"
      aria-labelledby="quiz-heading"
    >
      <h1 id="quiz-heading">Quiz</h1>
      <div id="quiz-root"></div>
    </section>

    <!-- 3. Results -->
    <section
      id="training-results"
      class="training-screen results-screen"
      aria-labelledby="results-heading"
    >
      <h1 id="results-heading">Training complete</h1>
      <div id="results-root"></div>
    </section>
  </main>

  <script type="module" src="../scripts/training.js"></script>
</body>
</html>
